name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/FolderShift.Tests -c Release

      - name: Build
        run: dotnet build src/FolderShift -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: FolderShift-${{ github.sha }}
          path: src/FolderShift/bin/Release/net48/FolderShift.exe
          retention-days: 14
